# Runs the automated tests on every push and pull request: the edit-plan validation
# (tests/test_edl.py) and the AI request loop with a fake client (tests/test_planner_loop.py).
# They need pydantic and numpy (app/music.py, imported by the planner): no ffmpeg, no API key,
# nothing secret, and no call to the real API.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  edl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2.6" "numpy>=1.26" pytest
      - run: python -m pytest -q
